<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escáner QR con Registro de Tiempo</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen text-gray-800">

    <div class="container mx-auto p-4 max-w-xl">
        <header class="text-center my-6">
            <h1 class="text-2xl font-bold text-blue-600">Escáner QR de Eventos</h1>
            <p class="text-sm text-gray-500">Escanea y almacena datos con marca de tiempo</p>
        </header>

        <div class="bg-white p-4 rounded-xl shadow-md mb-6">
            <div id="contenedor-camara" class="w-full bg-black rounded-lg overflow-hidden aspect-square relative flex items-center justify-center">
                <p id="placeholder-texto" class="text-gray-400 text-sm text-center p-4">La cámara está apagada.<br>Presiona el botón de abajo para iniciar.</p>
                <div id="reader" class="w-full absolute top-0 left-0 h-full hidden"></div>
            </div>

            <div class="grid grid-cols-2 gap-3 mt-4">
                <button id="btn-iniciar" onclick="encenderCamara()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-4 rounded-lg transition duration-200 shadow cursor-pointer text-center">
                    📷 Activar Cámara
                </button>
                <button id="btn-detener" onclick="apagarCamara()" class="bg-gray-500 hover:bg-gray-600 text-white font-semibold py-2.5 px-4 rounded-lg transition duration-200 shadow cursor-pointer text-center" disabled>
                    Apagar
                </button>
            </div>
        </div>

        <div class="bg-white p-4 rounded-xl shadow-md">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-gray-700">Datos Escaneados</h2>
                <button onclick="limpiarRegistros()" class="text-xs text-red-500 hover:text-red-700 font-medium cursor-pointer">
                    Limpiar todo
                </button>
            </div>

            <div class="overflow-x-auto max-h-60">
                <table class="w-full text-left text-xs border-collapse">
                    <thead>
                        <tr class="bg-gray-100 text-gray-600 uppercase tracking-wider border-b border-gray-200">
                            <th class="p-2.5">Fecha / Hora</th>
                            <th class="p-2.5">Información / Código</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-registros" class="divide-y divide-gray-100">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let html5QrCode;
        const qrConfig = { fps: 10, qrbox: { width: 250, height: 250 } };

        // Almacenamiento local para no perder datos al recargar la página
        let historialEscaneos = JSON.parse(localStorage.getItem('historial_qr')) || [];

        // Inicializar la app mostrando registros anteriores si existen
        document.addEventListener("DOMContentLoaded", () => {
            actualizarTabla();
        });

        function encenderCamara() {
            const readerDiv = document.getElementById('reader');
            const placeholder = document.getElementById('placeholder-texto');
            
            readerDiv.classList.remove('hidden');
            placeholder.classList.add('hidden');

            // Crear la instancia del escáner apuntando al contenedor "reader"
            html5QrCode = new Html5Qrcode("reader");

            // Configurar botones
            document.getElementById('btn-iniciar').disabled = true;
            document.getElementById('btn-detener').disabled = false;

            html5QrCode.start(
                { facingMode: "environment" }, // "environment" fuerza la cámara trasera en smartphones
                qrConfig,
                (decodedText, decodedResult) => {
                    // Acción cuando detecta un código QR de manera exitosa
                    registrarCodigo(decodedText);
                    
                    // Efecto visual rápido al escanear (parpadeo verde)
                    const contenedor = document.getElementById('contenedor-camara');
                    contenedor.classList.add('border-4', 'border-green-500');
                    setTimeout(() => contenedor.classList.remove('border-4', 'border-green-500'), 500);
                },
                (errorMessage) => {
                    // Mantener vacío para evitar saturar la consola con errores de escaneo por milisegundo
                }
            ).catch((err) => {
                console.error("Error al iniciar la cámara:", err);
                alert("No se pudo acceder a la cámara. Asegúrate de dar los permisos correspondientes y estar usando HTTPS.");
                apagarCamara();
            });
        }

        function apagarCamara() {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    resetearInterfaz();
                }).catch((err) => {
                    console.error("Error al detener la cámara:", err);
                    resetearInterfaz();
                });
            } else {
                resetearInterfaz();
            }
        }

        function resetearInterfaz() {
            document.getElementById('reader').classList.add('hidden');
            document.getElementById('placeholder-texto').classList.remove('hidden');
            document.getElementById('btn-iniciar').disabled = false;
            document.getElementById('btn-detener').disabled = true;
        }

        function registrarCodigo(texto) {
            const ahora = new Date();
            
            // Formatear Fecha y Hora local legible (Ej: 02/06/2026 17:54:02)
            const fechaHora = ahora.toLocaleDateString() + ' ' + ahora.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

            // Crear el objeto del nuevo registro
            const nuevoRegistro = {
                marcaTiempo: fechaHora,
                contenido: texto
            };

            // Guardar al inicio de la lista
            historialEscaneos.unshift(nuevoRegistro);
            localStorage.setItem('historial_qr', JSON.stringify(historialEscaneos));

            actualizarTabla();
        }

        function actualizarTabla() {
            const tbody = document.getElementById('tabla-registros');
            tbody.innerHTML = '';

            if (historialEscaneos.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="2" class="p-4 text-center text-gray-400 italic">No hay códigos registrados aún.</td>
                    </tr>
                `;
                return;
            }

            historialEscaneos.forEach(item => {
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50 transition-colors">
                        <td class="p-2.5 font-mono text-gray-500 whitespace-nowrap">${item.marcaTiempo}</td>
                        <td class="p-2.5 text-gray-900 break-all font-medium">${filtrarTexto(item.contenido)}</td>
                    </tr>
                `;
            });
        }

        function limpiarRegistros() {
            if (confirm("¿Estás seguro de que deseas borrar todo el historial?")) {
                historialEscaneos = [];
                localStorage.removeItem('historial_qr');
                actualizarTabla();
            }
        }

        // Medida de seguridad básica para evitar inyecciones de código si el QR contiene HTML malicioso
        function filtrarTexto(string) {
            const temp = document.createElement('div');
            temp.textContent = string;
            return temp.innerHTML;
        }
    </script>
</body>
</html>
